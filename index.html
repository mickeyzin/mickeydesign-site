<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mickeydesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Mickeydesign — edição de vídeo, motion design e flyers animados por João Vitor Souza.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=Rubik+Wet+Paint&family=Permanent+Marker&family=Archivo:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a black concrete wall. White is the only paint — spray, drips, chains, tape. Timecode marks every section, like a video timeline. */
:root{
  --ink:#080807;      /* the wall */
  --soot:#131210;     /* raised surfaces */
  --bone:#ECE8DF;     /* the only paint */
  --ash:#8C887F;      /* secondary text */
  --line:rgba(236,232,223,.14);
  --f-display:"Big Shoulders Stencil Display","Impact","Arial Narrow",sans-serif;
  --f-drip:"Rubik Wet Paint","Impact",sans-serif;
  --f-tag:"Permanent Marker","Comic Sans MS",cursive;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --pad:clamp(16px, 4vw, 56px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink);overflow-x:clip}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:var(--ink);color:var(--bone);font-family:var(--f-body);font-size:16px;line-height:1.55;overflow-x:clip;-webkit-font-smoothing:antialiased}
::selection{background:var(--bone);color:var(--ink)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px dashed var(--bone);outline-offset:4px}
img{display:block;max-width:100%}
h1,h2,h3{margin:0;font-weight:900;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.wrap{padding-left:max(var(--pad), env(safe-area-inset-left, 0px));padding-right:max(var(--pad), env(safe-area-inset-right, 0px))}

/* grain over everything */
.grain{position:fixed;inset:-50%;z-index:90;pointer-events:none;opacity:.09;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .9s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-6%,-2%)}80%{transform:translate(5%,4%)}100%{transform:translate(0,0)}}
.vignette{position:fixed;inset:0;z-index:89;pointer-events:none;background:radial-gradient(ellipse at center,transparent 70%,rgba(0,0,0,.4) 100%)}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto;z-index:70;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-top:calc(14px + env(safe-area-inset-top, 0px));padding-bottom:14px;padding-left:max(var(--pad), env(safe-area-inset-left, 0px));padding-right:max(var(--pad), env(safe-area-inset-right, 0px));
  color:var(--bone)}
.logo{mix-blend-mode:difference;color:#fff;font-family:var(--f-tag);font-size:26px;line-height:1;transform:rotate(-6deg);display:inline-block}
.nav ul{list-style:none;margin:0;padding:0;display:flex;gap:8px;align-items:center}
.nav a.navlink,.nav .sound{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;line-height:1;
  padding:11px 16px;border-radius:99px;color:var(--bone);background:rgba(8,8,7,.72);border:1px solid rgba(236,232,223,.32);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.45);transition:background .3s,color .3s,border-color .3s,box-shadow .3s}
.nav a.navlink:hover,.nav .sound:hover{border-color:var(--bone);box-shadow:0 0 0 1px var(--bone),0 0 22px rgba(236,232,223,.35)}
.nav a.navlink[aria-current="page"]{background:var(--bone);color:var(--ink);border-color:var(--bone);box-shadow:0 0 24px rgba(236,232,223,.45)}
@media (max-width:520px){.nav ul{gap:5px}.nav a.navlink,.nav .sound{font-size:11px;letter-spacing:.08em;padding:9px 10px}}

.rec{position:fixed;z-index:70;left:max(var(--pad), env(safe-area-inset-left, 0px));bottom:calc(14px + env(safe-area-inset-bottom, 0px));display:flex;gap:10px;align-items:center;mix-blend-mode:difference;color:#fff;font-variant-numeric:tabular-nums}
.rec i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hint{position:fixed;z-index:70;right:max(var(--pad), env(safe-area-inset-right, 0px));bottom:calc(14px + env(safe-area-inset-bottom, 0px));mix-blend-mode:difference;color:#fff}

/* ---------- cursor & spray ---------- */
#spray{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none;mix-blend-mode:difference}
.cursor{position:fixed;left:0;top:0;z-index:95;pointer-events:none;width:38px;height:38px;margin:-19px 0 0 -19px;border:1.5px solid #fff;border-radius:50%;mix-blend-mode:difference;
  display:grid;place-items:center;transition:width .35s,height .35s,margin .35s,background .35s,border-style .2s}
.cursor span{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:#000;opacity:0;transition:opacity .2s}
.cursor.is-link{width:64px;height:64px;margin:-32px 0 0 -32px}
.cursor.is-view{width:96px;height:96px;margin:-48px 0 0 -48px;background:#fff}
.cursor.is-view span{opacity:1}
.cursor.is-spray{width:22px;height:22px;margin:-11px 0 0 -11px;border-style:dashed;animation:spin 1s linear infinite}
@keyframes spin{to{rotate:360deg}}
.cursor-dot{position:fixed;left:0;top:0;z-index:96;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#fff;pointer-events:none;mix-blend-mode:difference}
@media (hover:none){.cursor,.cursor-dot,.hint{display:none}}
@media (hover:hover){html.has-cursor, html.has-cursor *{cursor:none!important}}

/* ---------- transition ---------- */
#veil{position:fixed;inset:0;width:100%;height:100%;z-index:91;pointer-events:none}
#veil.on{pointer-events:all}

/* ---------- reveal ---------- */
.js [data-reveal]{opacity:0;transform:translateY(46px);transition:opacity 1s cubic-bezier(.2,.7,.1,1),transform 1.1s cubic-bezier(.2,.7,.1,1);transition-delay:var(--d,0s)}
.js [data-reveal].in{opacity:1;transform:none}
.split .ch{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.02em}
.split .ch > span{display:inline-block;transform:translateY(105%);transition:transform 1.1s cubic-bezier(.7,0,.1,1);transition-delay:calc(var(--i) * 45ms + var(--d,0s))}
.split.in .ch > span{transform:none}

/* ---------- hero ---------- */
.hero{position:relative;min-height:min(100svh,1000px);display:grid;grid-template-rows:auto 1fr auto auto;padding-top:calc(90px + env(safe-area-inset-top,0px));padding-bottom:0;overflow:hidden;isolation:isolate}
.ceiling{position:absolute;inset:0 0 auto;height:320px;filter:url(#goo);z-index:4;pointer-events:none}
.ceiling .bar{position:absolute;left:-20px;right:-20px;top:-30px;height:44px;background:var(--bone);border-radius:0 0 40% 40%/0 0 14px 14px}
.ceiling i{position:absolute;top:0;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:var(--bone);animation:drop var(--t) cubic-bezier(.55,0,.85,.6) var(--dl) infinite}
@keyframes drop{0%{transform:translateY(-10px) scale(1)}55%{transform:translateY(46px) scale(.85,1.25)}100%{transform:translateY(300px) scale(.55,1.4);opacity:.0}}
.ceiling .stalk{position:absolute;top:0;left:var(--x);width:var(--s);height:var(--h);background:var(--bone);border-radius:0 0 50% 50%;animation:ooze var(--t) ease-in-out var(--dl) infinite alternate;transform-origin:top}
@keyframes ooze{from{transform:scaleY(.4)}to{transform:scaleY(1.1)}}
canvas.chains{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.hero-top{position:relative;z-index:5;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--ash)}
.hero-photo ~ .hero-title{mix-blend-mode:difference}
.hero-title{position:relative;z-index:2;align-self:center;line-height:.78;margin-top:4vh}
.ht-a{display:block;font-family:var(--f-display);font-size:clamp(96px,25vw,440px);letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap}
.ht-a .ch{will-change:transform}
.ht-b{display:block;font-family:var(--f-drip);font-weight:400;font-size:clamp(64px,13vw,230px);line-height:.9;margin-top:-.25em;margin-left:34%;transform:rotate(-7deg);text-shadow:0 0 30px rgba(236,232,223,.35),0 0 2px var(--bone)}
.hero-low{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.hero-low p{max-width:38ch;font-size:clamp(16px,1.4vw,19px);color:var(--bone)}
.scroll-cue{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ash)}
.scroll-cue b{width:2px;height:60px;background:linear-gradient(var(--bone),transparent);animation:cue 2s ease-in-out infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

/* ---------- section label (timecode) ---------- */
.tc{display:flex;gap:14px;align-items:center;color:var(--ash);font-variant-numeric:tabular-nums}
.tc::before{content:"";width:28px;height:1px;background:currentColor}

/* ---------- manifesto ---------- */
.manifesto{padding-block:clamp(110px,18vw,240px);position:relative}
.manifesto .big{font-family:var(--f-body);font-weight:700;font-size:clamp(30px,5.2vw,82px);line-height:1.04;letter-spacing:-.02em;max-width:18ch;margin-top:40px;text-wrap:pretty}
.manifesto .big .w{opacity:.14;transition:opacity .15s linear}
.manifesto .big em{font-style:normal;font-family:var(--f-tag);font-weight:400;letter-spacing:0}
.manifesto .side{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:32px;margin-top:80px;max-width:900px;margin-left:auto;color:var(--ash)}

/* ---------- tape ---------- */
.tapes{position:relative;height:clamp(180px,24vw,300px);overflow:hidden;display:grid;place-items:center}
.tape{position:absolute;left:-10%;width:120%;background:var(--bone);color:var(--ink);padding-block:14px;white-space:nowrap;font-family:var(--f-display);font-size:clamp(26px,3.6vw,48px);letter-spacing:.04em;text-transform:uppercase;box-shadow:0 10px 40px rgba(0,0,0,.7)}
.tape.t1{rotate:-4deg}
.tape.t2{rotate:3deg;background:var(--ink);color:var(--bone);border-block:2px solid var(--bone)}
.tape .track{display:inline-flex;gap:0;will-change:transform}
.tape .track span{padding-right:.6em}

/* ---------- horizontal works ---------- */
.hworks{position:relative}
.hworks .sticky{position:sticky;top:0;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:28px}
.hworks .head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.h2{font-family:var(--f-display);font-size:clamp(56px,10vw,170px);line-height:.82;text-transform:uppercase}
.h2 .tag{font-family:var(--f-tag);font-weight:400;text-transform:none;font-size:.42em;display:inline-block;transform:rotate(-8deg) translateY(-.4em);margin-left:.2em}
.hworks .track{display:flex;gap:clamp(18px,3vw,48px);will-change:transform;padding-left:max(var(--pad), env(safe-area-inset-left, 0px));padding-right:max(var(--pad), env(safe-area-inset-right, 0px))}
.hworks .card{flex:0 0 clamp(220px,min(30vw,calc((100svh - 330px) * .78)),460px)}
.hworks .card:nth-child(even){margin-top:4vh}
.progress{height:2px;background:var(--line);position:relative}
.progress b{position:absolute;inset:0;background:var(--bone);transform-origin:left;transform:scaleX(0)}

/* ---------- project card ---------- */
.card{display:block;position:relative}
.card .media{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--soot)}
.card .media img,.card .media video{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.08);transition:transform 1.4s cubic-bezier(.2,.7,.1,1),filter .4s}
.card:hover .media img,.card:hover .media video{transform:scale(1.0);filter:contrast(1.25)}
.card:hover .media{animation:glitch .5s steps(2) 1}
@keyframes glitch{0%{filter:none}12%{filter:invert(1)}16%{filter:none;transform:translateX(-6px) skewX(4deg)}24%{transform:translateX(5px)}32%{transform:none}}
.card .media::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,7,.7),transparent 45%);pointer-events:none}
.card .media .stamp{position:absolute;z-index:2;left:14px;bottom:12px;right:14px;display:flex;justify-content:space-between;color:var(--bone)}
.card .info{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:14px}
.card h3{font-family:var(--f-display);font-size:clamp(26px,2.6vw,40px);text-transform:uppercase;line-height:.95}
.card .kind{color:var(--ash);text-align:right;white-space:nowrap}

/* ---------- services (white) ---------- */
.white{background:var(--bone);color:var(--ink);position:relative;z-index:2}
.white .tc{color:#5d5a54}
.services{padding-top:clamp(90px,12vw,160px);padding-bottom:40px}
.svc-list{list-style:none;margin:60px 0 0;padding:0;border-top:2px solid var(--ink)}
.svc{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:24px;align-items:center;padding-block:28px;border-bottom:2px solid var(--ink);position:relative;overflow:hidden}
.svc h3{font-family:var(--f-display);font-size:clamp(40px,6.4vw,104px);line-height:.85;text-transform:uppercase;position:relative;z-index:1;transition:transform .6s cubic-bezier(.2,.7,.1,1)}
.svc p{max-width:44ch;position:relative;z-index:1}
.svc .tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:220px;position:relative;z-index:1}
.svc .tools span{border:1.5px solid var(--ink);border-radius:99px;padding:3px 10px;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.svc::before{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .6s cubic-bezier(.7,0,.2,1)}
.svc:hover::before{transform:none}
.svc:hover{color:var(--bone)}
.svc:hover .tools span{border-color:var(--bone)}
.svc:hover h3{transform:translateX(16px) skewX(-6deg)}
@media (max-width:820px){.svc{grid-template-columns:1fr}.svc .tools{justify-content:flex-start;max-width:none}}
canvas.drip-edge{position:absolute;left:0;top:100%;width:100%;height:280px;pointer-events:none;z-index:3}

/* ---------- CTA footer ---------- */
.cta{position:relative;padding-top:clamp(240px,30vw,380px);padding-bottom:40px;overflow:hidden}
.cta canvas.chains{z-index:1}
.cta .giant{position:relative;z-index:2;display:block;font-family:var(--f-display);text-transform:uppercase;font-size:clamp(70px,17vw,300px);line-height:.8}
.cta .giant .out{color:transparent;-webkit-text-stroke:2px var(--bone)}
.cta .giant:hover .out{color:var(--bone)}
.cta .giant .tag{font-family:var(--f-tag);text-transform:none;font-size:.3em;display:inline-block;rotate:-10deg;vertical-align:top;margin-top:.4em}
.foot{position:relative;z-index:2;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:120px;padding-top:24px;padding-bottom:40px;border-top:1px solid var(--line);color:var(--ash)}
.foot a:hover{color:var(--bone)}

/* ---------- page heads ---------- */
.phead{padding-top:calc(150px + env(safe-area-inset-top,0px));padding-bottom:60px;position:relative}
.phead h1{font-family:var(--f-display);font-size:clamp(76px,17vw,300px);line-height:.8;text-transform:uppercase}
.phead h1 sup{font-family:var(--f-mono);font-size:14px;letter-spacing:.1em;vertical-align:top;font-weight:400;margin-left:10px}
.phead .row{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-top:36px}
.phead .row p{max-width:46ch;color:var(--ash)}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1.5px solid var(--line);border-radius:99px;padding:8px 16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;transition:background .3s,color .3s,border-color .3s}
.filters button:hover{border-color:var(--bone)}
.filters button[aria-pressed="true"]{background:var(--bone);color:var(--ink);border-color:var(--bone)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,5vw,90px) clamp(18px,4vw,64px);padding-bottom:120px}
.grid .card:nth-child(even){margin-top:clamp(0px,14vw,220px)}
.grid .card.hide{display:none}
@media (max-width:640px){.grid{grid-template-columns:1fr}.grid .card:nth-child(even){margin-top:0}}

/* ---------- project page ---------- */
.proj-hero{position:relative;padding-top:calc(130px + env(safe-area-inset-top,0px))}
.proj-hero .kicker{display:flex;gap:16px;flex-wrap:wrap;color:var(--ash)}
.proj-hero h1{font-family:var(--f-display);font-size:clamp(64px,13vw,230px);line-height:.82;text-transform:uppercase;margin-top:24px}
.proj-hero .sub{font-family:var(--f-tag);font-size:clamp(22px,2.6vw,38px);rotate:-3deg;display:inline-block;margin-top:14px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;margin-top:60px;padding-block:22px;border-block:1px solid var(--line)}
.meta div{display:flex;flex-direction:column;gap:6px;min-width:0}
.meta dt{color:var(--ash)}
.meta dd{margin:0;font-weight:500}
@media (max-width:720px){.meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.proj-cover{margin-top:60px;overflow:hidden;aspect-ratio:16/9;max-width:100%;background:var(--soot);position:relative}
.proj-cover img,.proj-cover video{width:100%;height:120%;object-fit:cover;display:block;will-change:transform}
.proj-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:clamp(24px,6vw,100px);padding-block:clamp(80px,10vw,140px)}
.proj-body h2{font-family:var(--f-display);font-size:clamp(36px,4vw,64px);line-height:.9;text-transform:uppercase}
.proj-body .txt{display:grid;gap:22px;font-size:clamp(17px,1.4vw,20px);max-width:62ch}
@media (max-width:820px){.proj-body{grid-template-columns:1fr}}
.frames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2vw,28px)}
.frames figure{margin:0;position:relative;overflow:hidden;background:var(--soot)}
.frames:not(.phones) figure:first-child{grid-column:1/-1}
.frames.phones{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.frames.phones figure{border-radius:28px;border:6px solid #1a1a19;box-shadow:0 0 0 1px rgba(236,232,223,.3),0 30px 60px rgba(0,0,0,.6);background:#1a1a19}
.frames.phones figure:nth-child(2){margin-top:12vh}
.frames.phones figure img{aspect-ratio:auto;height:auto;border-radius:22px}
.frames.phones figcaption{top:auto;bottom:-34px;left:4px;color:var(--ash)}
.frames.phones figure{overflow:visible;margin-bottom:40px}
@media (max-width:700px){.frames.phones{grid-template-columns:repeat(2,minmax(0,1fr))}.frames.phones figure:nth-child(2){margin-top:8vh}}
.frames figure img,.frames figure video{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.frames figcaption{position:absolute;left:12px;top:10px;color:var(--bone)}
.next{display:block;padding-block:clamp(100px,14vw,200px);text-align:center;position:relative;overflow:hidden}
.next .mono{color:var(--ash)}
.next strong{display:block;font-family:var(--f-display);font-size:clamp(56px,11vw,190px);line-height:.85;text-transform:uppercase;margin-top:16px;transition:letter-spacing .7s cubic-bezier(.2,.7,.1,1)}
.next:hover strong{letter-spacing:.04em}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(30px,6vw,110px);align-items:start;padding-bottom:clamp(80px,10vw,140px)}
.portrait{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--soot)}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait .label{position:absolute;left:14px;bottom:12px;font-family:var(--f-tag);font-size:22px;rotate:-4deg}
.bio{display:grid;gap:24px;font-size:clamp(18px,1.6vw,23px);max-width:58ch}
.bio .lead{font-size:clamp(26px,2.8vw,42px);line-height:1.12;font-weight:700;letter-spacing:-.01em}
.tools-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.55, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g); g.connect(shaper()); o.start(t); o.stop(t + dur + .05); }

})();

const sndBtn = $("#sound");
function setSound(go, remember = true) {
  go ? Sound.start() : Sound.stop();
  sndBtn.setAttribute("aria-pressed", go); $(".lbl", sndBtn).textContent = go ? "Som on" : "Som off";
  if (remember) try { localStorage.setItem("md-sound", go ? "1" : "0"); } catch (e) {}
}
sndBtn.addEventListener("click", () => setSound(!Sound.on));
let mutedBefore = false; try { mutedBefore = localStorage.getItem("md-sound") === "0"; } catch (e) {}
// entry gate: the click that opens the site is the one that lets the music play
function entryGate(muted = false) {
  return new Promise(res => {
    const g = document.createElement("div"); g.className = "gate";
    g.innerHTML = `<span class="mono">Mickeydesign · ${muted ? "som desligado" : "este site tem som"}</span>
      <button type="button" class="gate-in" id="gate-in"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Entrar</button>
      <button type="button" class="gate-mute mono" id="gate-mute">${muted ? "Entrar com som" : "Entrar sem som"}</button>
      <span class="mono gate-tip">Melhor com fone</span>`;
    document.body.appendChild(g); requestAnimationFrame(() => g.classList.add("on"));
    const done = sound => { setSound(sound); g.classList.remove("on"); setTimeout(() => g.remove(), 500); removeEventListener("keydown", onKey); res(); };
    const onKey = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); done(!muted); } };
    $("#gate-in", g).addEventListener("click", () => done(!muted));
    $("#gate-mute", g).addEventListener("click", () => done(muted));
    addEventListener("keydown", onKey); $("#gate-in", g).focus({ preventScroll: true });
  });
}
// beat-reactive values
const sBars = $$(".bars i", sndBtn); let prevLow = 0;
globalTicks.push(() => {
  const b = Sound.bins();
  sBars.forEach((el, i) => { const v = b ? b[2 + i * 6] / 255 : .15 + .1 * Math.sin(S.t * 2 + i); el.style.transform = `scaleY(${.2 + v * .9})`; });
  const l = Sound.level(); S.kick = Math.max((S.kick || 0) * .86, l - prevLow > .05 ? Math.min(1, l * 1.2) : 0); prevLow = l;
  document.documentElement.style.setProperty("--kick", S.kick.toFixed(3));
});

/* ---------- boot ---------- */
(async () => {
  veil.classList.add("on");
  let pct = 0; const tick = setInterval(() => { pct = Math.min(99, pct + 3 + Math.random() * 9); drawVeil(-10, VH + maxDrip(), 1, String(Math.floor(pct)).padStart(3, "0"), 1); }, 60);
  drawVeil(-10, VH + maxDrip(), 1, "000", 1);
  requestAnimationFrame(loop);
  try { await Promise.race([Promise.all([document.fonts.load('900 100px "Big Shoulders Stencil Display"'), document.fonts.load('600 20px "JetBrains Mono"'), document.fonts.load('40px "Permanent Marker"'), document.fonts.ready]), sleep(3000)]); } catch (e) {}
  if (!SITE.heroImage) EYE = makeEye(1000);
  const wall = $(".wall");
  try { wall.style.backgroundImage = `url(${makeWall(Math.min(2200, Math.max(1400, innerWidth * 1.2)) | 0, Math.min(1500, Math.max(1000, innerHeight * 1.3)) | 0)})`; wall.classList.add("ready"); } catch (e) {}
  if (!REDUCED) globalTicks.push(() => { wall.style.transform = `translateY(${Math.max(-S.y * .04, -innerHeight * .09)}px)`; });
  const r = resolve(location.hash);
  mount(r); current = r.key;
  await sleep(REDUCED ? 0 : 600);
  clearInterval(tick); drawVeil(-10, VH + maxDrip(), 1, "100", 1);
  await sleep(REDUCED ? 0 : 220);
  // the entry gate shows on every visit
  drawVeil(-10, VH + maxDrip(), 1, "", 0); await entryGate(mutedBefore);
  veilOut("100");
  await sleep(REDUCED ? 0 : 350);
  revealVisible(view);
})();
})();
